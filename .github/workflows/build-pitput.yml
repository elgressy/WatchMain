name: Build Pitput APK

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'pitput/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - '.github/workflows/build-pitput.yml'

permissions:
  contents: write

concurrency:
  group: pitput-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships the Android SDK at $ANDROID_HOME; setup-android@v3 currently breaks on it.
      - name: Accept SDK licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :pitput:assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp pitput/build/outputs/apk/debug/pitput-debug.apk dist/pitput.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pitput-apk
          path: dist/pitput.apk

      - name: Publish as "pitput-latest" release (easy download from the phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete pitput-latest --yes --cleanup-tag || true
          gh release create pitput-latest dist/pitput.apk \
            --target "${{ github.sha }}" --prerelease \
            --title "פטפוט — גרסה אחרונה (${{ github.ref_name }})" \
            --notes "להורדה בטלפון: לחצו על pitput.apk → פתיחה → התקנה. בנוי מ-${{ github.sha }}"

      - name: Commit APK back to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/pitput.apk
          if git diff --cached --quiet; then
            echo "No APK changes to commit"
          else
            git commit -m "Add built Pitput APK [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
