name: Build debug APKs

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Build debug APKs
        run: |
          chmod +x gradlew
          ./gradlew :mobile:assembleDebug :wear:assembleDebug --no-daemon --stacktrace

      - name: Collect APKs into dist/
        run: |
          mkdir -p dist
          cp mobile/build/outputs/apk/debug/mobile-debug.apk dist/mobile-debug.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk dist/wear-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pulsewave-debug-apks
          path: dist/*.apk

      - name: Commit APKs back to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/mobile-debug.apk dist/wear-debug.apk
          if git diff --cached --quiet; then
            echo "No APK changes to commit"
          else
            git commit -m "Add built debug APKs [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
