<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1B1150">
<title>פטפוט של שחף</title>
<style>
@font-face{font-family:"Fredoka";src:url(fonts/fredoka-hebrew.woff2) format("woff2");font-weight:300 700;unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:"Fredoka";src:url(fonts/fredoka-latin.woff2) format("woff2");font-weight:300 700;unicode-range:U+0000-00FF,U+2000-206F}
:root{
  --sky1:#1B1150; --sky2:#3A1D8A; --sky3:#7A2CB8;
  --ink:#2A1A4A; --paper:#FFFFFF; --soft:#7C6A9E;
  --pink:#FF4FA3; --orange:#FF8A3D; --yellow:#FFD23F; --lime:#7BE36A; --cyan:#3CD3F5; --violet:#9B6BFF;
  --r:30px;
  --font:"Fredoka","Rubik","Noto Sans Hebrew",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--sky1);color:#fff;font-family:var(--font);overscroll-behavior:none}
body{user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
input,select,textarea{font:inherit;user-select:text;-webkit-user-select:text}

/* ---------- night sky background ---------- */
.sky{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 34%, #8E2C9E 58%, #E0457B 72%, #FF8A4C 82%)}
.sun{position:absolute;left:50%;bottom:13vh;width:46vw;max-width:260px;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(circle,#FFE38A 0%,#FFB347 45%,rgba(255,138,76,0) 70%);opacity:.9;animation:sunglow 6s ease-in-out infinite}
@keyframes sunglow{50%{transform:translateX(-50%) scale(1.06)}}
.sea{position:absolute;left:0;right:0;bottom:0;height:22vh}
.wave{position:absolute;left:0;width:200%;bottom:0;background-repeat:repeat-x;background-size:50% 100%;animation:sway linear infinite}
.wave.w1{height:100%;animation-duration:16s;opacity:.95}
.wave.w2{height:80%;animation-duration:10s;animation-direction:reverse;opacity:.9}
.wave.w3{height:58%;animation-duration:7s;opacity:.95}
@keyframes sway{from{transform:translateX(-50%)}to{transform:translateX(0)}}
.gull-fly{position:absolute;font-size:0;width:44px;height:16px;animation:flyby linear infinite;opacity:.75}
.gull-fly svg{width:100%;height:100%}
@keyframes flyby{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.sky i{position:absolute;border-radius:50%;opacity:.55;filter:blur(1px);animation:rise linear infinite}
.sky i.b{background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.9), rgba(255,255,255,.15) 40%, rgba(255,255,255,.05) 70%);border:1px solid rgba(255,255,255,.25)}
.sky i.s{background:#fff;opacity:.9;filter:none;animation:twinkle ease-in-out infinite}
.sky i.b{z-index:1}
@keyframes rise{from{transform:translateY(110vh)}to{transform:translateY(-20vh)}}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}

.screen{position:fixed;inset:0;z-index:1;display:none;flex-direction:column;
  padding:max(14px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom))}
.screen.on{display:flex;animation:enter .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes enter{from{opacity:0;transform:scale(.94) translateY(12px)}}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:60px;position:relative;z-index:2}
.grow{flex:1;min-height:0}
h1,h2,h3{margin:0}

/* ---------- candy 3D buttons ---------- */
.candy{position:relative;border-radius:var(--r);color:#fff;
  background:linear-gradient(180deg,var(--c1),var(--c2));
  box-shadow:0 8px 0 var(--c3), 0 16px 26px rgba(0,0,0,.35), inset 0 -6px 0 rgba(0,0,0,.08);
  transition:transform .08s, box-shadow .08s}
.candy::before{content:"";position:absolute;top:6px;right:8%;left:8%;height:38%;border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
.candy:active{transform:translateY(6px) scale(.98);box-shadow:0 2px 0 var(--c3), 0 6px 12px rgba(0,0,0,.3)}
.icon-btn{width:58px;height:58px;border-radius:50%;font-size:28px;display:grid;place-items:center;flex:none;
  --c1:#ffffff;--c2:#E9E2FF;--c3:#A99BD6;color:var(--ink)}
.icon-btn::before{top:4px;height:42%}
.title{font-size:28px;font-weight:700;text-shadow:0 3px 0 rgba(0,0,0,.25)}

/* ---------- owl mascot ---------- */
.owl{display:block;overflow:visible}
.owl .lid{transform-box:fill-box;transform-origin:center top;transform:scaleY(0);animation:blink 4.5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
.owl .pupils{transition:transform .15s ease-out}
.owl .wingL,.owl .wingR{transform-box:fill-box}
.owl .wingL{transform-origin:right top}.owl .wingR{transform-origin:left top}
.owl-wrap{position:relative;display:inline-block}
.owl-wrap.idle .owl{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-2deg)}}
.owl-wrap.listen .owl{animation:tilt 1.6s ease-in-out infinite}
@keyframes tilt{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(-4deg) translateY(-3px)}}
.owl-wrap.party .owl{animation:dance .5s ease-in-out 4}
.owl-wrap.party .wingL{animation:flapL .25s ease-in-out 8}
.owl-wrap.party .wingR{animation:flapR .25s ease-in-out 8}
@keyframes dance{25%{transform:translateY(-22px) rotate(-10deg)}75%{transform:translateY(-22px) rotate(10deg)}}
@keyframes flapL{50%{transform:rotate(35deg)}}
@keyframes flapR{50%{transform:rotate(-35deg)}}
.owl-wrap .halo{position:absolute;inset:8%;border-radius:50%;border:5px solid var(--cyan);opacity:0;
  box-shadow:0 0 24px var(--cyan);transform:scale(calc(1 + var(--lvl,0)*.5));transition:transform .08s,opacity .2s}
.owl-wrap.listen .halo{opacity:calc(.35 + var(--lvl,0)*.65)}

/* ---------- home ---------- */
#home{align-items:center}
#homeOwl{margin-top:2vh;width:min(42vw,180px)}
.brand{font-size:56px;font-weight:700;line-height:1;margin-top:4px;letter-spacing:.5px;
  background:linear-gradient(90deg,var(--yellow),var(--orange),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 rgba(0,0,0,.35))}
.brand-sub{font-size:26px;font-weight:700;color:#fff;margin-top:-2px;text-shadow:0 3px 0 rgba(0,0,0,.3)}
.hello{color:#E6DBFF;font-size:19px;margin-top:6px;text-align:center;font-weight:500}
.modes{display:grid;gap:18px;width:100%;max-width:520px;margin-top:3.2vh}
.mode{display:flex;align-items:center;gap:14px;padding:16px 18px;font-size:32px;font-weight:700;text-align:right;
  text-shadow:0 2px 0 rgba(0,0,0,.2)}
.mode .e{font-size:44px;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.28);display:grid;place-items:center;flex:none;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.mode small{display:block;font-size:15px;font-weight:500;opacity:.92;text-shadow:none}
.mode:nth-child(1){--c1:#FFB547;--c2:#FF7A2F;--c3:#C4501A}
.mode:nth-child(2){--c1:#8BEA5B;--c2:#2FBF71;--c3:#1C8A4E}
.mode:nth-child(3){--c1:#58D8FF;--c2:#3B82F6;--c3:#2357B0}
.mode .e{animation:bob 2.6s ease-in-out infinite}
.mode:nth-child(2) .e{animation-delay:-.8s}.mode:nth-child(3) .e{animation-delay:-1.6s}
.tip{margin-top:auto;width:100%;max-width:520px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:20px;padding:12px 14px;font-size:15px;line-height:1.5;color:#EDE6FF}
.tip b{color:var(--yellow)}
.gate{position:absolute;top:max(14px,env(safe-area-inset-top));left:16px;z-index:3}
.gate .ring{position:absolute;inset:-5px;border-radius:50%;pointer-events:none;
  background:conic-gradient(var(--yellow) calc(var(--p,0)*1%), transparent 0);
  -webkit-mask:radial-gradient(circle, transparent 60%, #000 62%);mask:radial-gradient(circle, transparent 60%, #000 62%)}
.gate .icon-btn{width:48px;height:48px;font-size:22px;opacity:.85}
.gate-hint{position:absolute;top:58px;left:0;white-space:nowrap;font-size:13px;color:#E6DBFF;opacity:0;transition:.3s}
.gate.hint .gate-hint{opacity:1}

/* ---------- categories ---------- */
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;overflow:auto;padding:10px 4px 30px;align-content:start}
.cat{padding:14px 8px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:23px;font-weight:700;
  text-shadow:0 2px 0 rgba(0,0,0,.2);animation:popin .45s cubic-bezier(.3,1.6,.5,1) backwards}
.cat .e{font-size:54px;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.3);
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.08)}
@keyframes popin{from{transform:scale(.4);opacity:0}}

/* ---------- word card ---------- */
.stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0;perspective:1200px}
.card{width:min(82vw,420px);max-height:100%;aspect-ratio:3/3.7;border-radius:44px;position:relative;
  background:linear-gradient(165deg,#fff 0%,#F6F0FF 100%);
  box-shadow:0 10px 0 var(--c3,#B9A6E8), 0 26px 50px rgba(0,0,0,.45);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4vh;color:var(--ink);transition:transform .12s}
.card::after{content:"";position:absolute;inset:10px;border-radius:36px;border:4px dashed var(--c2,#ddd);opacity:.45;pointer-events:none}
.card .spot{position:absolute;top:9%;width:72%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle, var(--c1,#FFE08A) 0%, transparent 70%);opacity:.75;animation:pulse2 3s ease-in-out infinite}
@keyframes pulse2{50%{transform:scale(1.08);opacity:.95}}
.card .pic{position:relative;font-size:min(36vw,180px);line-height:1;display:grid;place-items:center;width:74%;aspect-ratio:1;
  filter:drop-shadow(0 12px 10px rgba(0,0,0,.18))}
.card .pic img{width:100%;height:100%;object-fit:cover;border-radius:32px;border:6px solid #fff;box-shadow:0 6px 0 var(--c3,#ccc)}
.card .word{position:relative;font-size:min(14vw,66px);font-weight:700;line-height:1.15;color:var(--ink)}
.card .snd{position:relative;font-size:24px;font-weight:600;color:var(--c3,#888);min-height:1.2em}
.card.in-next{animation:inNext .5s cubic-bezier(.3,1.4,.5,1)}
.card.in-prev{animation:inPrev .5s cubic-bezier(.3,1.4,.5,1)}
.card.pop{animation:pop .55s cubic-bezier(.3,1.6,.5,1)}
/* RTL: "next" comes in from the LEFT side (reading direction is right-to-left) */
@keyframes inNext{from{transform:translateX(-70vw) rotate(-14deg);opacity:0}}
@keyframes inPrev{from{transform:translateX(70vw) rotate(14deg);opacity:0}}
@keyframes pop{0%{transform:scale(.5) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
.card.boing .pic{animation:boing .6s}
@keyframes boing{30%{transform:scale(1.2,.84)}55%{transform:scale(.9,1.12) translateY(-18px)}80%{transform:scale(1.04,.97)}}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:16px}
.big-arrow{width:88px;height:88px;border-radius:50%;font-size:46px;display:grid;place-items:center}
.big-arrow.go{--c1:#FFB547;--c2:#FF6A3D;--c3:#B9441A}
.big-arrow.alt{--c1:#fff;--c2:#E9E2FF;--c3:#A99BD6;color:var(--ink);width:74px;height:74px;font-size:34px}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:56vw;font-weight:700}
.dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.25);transition:.3s}
.dots i.on{background:var(--yellow);box-shadow:0 0 10px var(--yellow);transform:scale(1.3)}

/* ---------- turn mode ---------- */
.turn-head{display:flex;align-items:center;justify-content:center;gap:10px;min-height:96px;margin-top:-4px}
#tuOwl{width:92px}
.prompt{font-size:28px;font-weight:700;min-height:40px;text-shadow:0 3px 0 rgba(0,0,0,.3)}
.parent-bar{display:flex;gap:12px;justify-content:center;padding-top:22px}
.pill{padding:13px 18px;border-radius:999px;font-size:18px;font-weight:700;--c1:#fff;--c2:#ECE5FF;--c3:#A99BD6;color:var(--ink)}
.pill.ok{--c1:#FFE066;--c2:#FFB800;--c3:#C27C00;color:#4A2A00}

/* ---------- peekaboo ---------- */
.peek{flex:1;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,1fr);gap:16px;padding:10px 0}
.hole{position:relative;border-radius:var(--r);overflow:hidden;color:var(--ink);
  background:linear-gradient(165deg,#fff,#F1EAFF);box-shadow:0 7px 0 #8E7BD0, 0 14px 24px rgba(0,0,0,.35);
  display:flex;flex-direction:column;align-items:center;justify-content:center}
.hole .pic{font-size:min(17vw,80px);line-height:1;width:66%;aspect-ratio:1;display:grid;place-items:center}
.hole .pic img{width:100%;height:100%;object-fit:cover;border-radius:20px}
.hole .w{font-size:24px;font-weight:700;opacity:0;transition:.3s .2s}
.hole.open .w{opacity:1}
.cloud{position:absolute;inset:0;display:grid;place-items:center;font-size:min(20vw,90px);
  background:radial-gradient(circle at 30% 25%, #9FE8FF, #4C9BFF 75%);
  transition:transform .65s cubic-bezier(.5,-0.5,.6,1),opacity .65s}
.cloud::after{content:"?";position:absolute;bottom:8px;left:14px;font-size:28px;font-weight:700;color:rgba(255,255,255,.75)}
.cloud span{animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 6px 4px rgba(0,0,0,.15))}
.hole.open .cloud{transform:translateY(-130%) scale(.6) rotate(14deg);opacity:0}
.hole.open .pic{animation:boing .7s .15s}

/* ---------- bye ---------- */
#bye{align-items:center;justify-content:center;text-align:center;gap:14px}
#byeOwl{width:min(50vw,210px)}
#bye h2{font-size:46px;color:var(--yellow);text-shadow:0 4px 0 rgba(0,0,0,.3)}
#bye .owl .lid{animation:none;transform:scaleY(1)}
.zzz{font-size:34px;font-weight:700;color:#CFC2FF;animation:bob 2s ease-in-out infinite}

/* ---------- parent area (light, calm, readable) ---------- */
#parent{padding-left:0;padding-right:0;background:#F6F2FF;color:var(--ink)}
#parent .top{padding:0 16px}
#parent .title{text-shadow:none;color:var(--ink);font-size:24px}
.tabs{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;flex:none}
.tab{padding:10px 14px;border-radius:999px;background:#fff;border:2px solid #E2D9F7;font-weight:600;font-size:15px;white-space:nowrap}
.tab.on{background:var(--sky2);color:#fff;border-color:var(--sky2)}
.pane{flex:1;overflow:auto;padding:4px 16px 40px;display:none}
.pane.on{display:block}
.box{background:#fff;border-radius:22px;padding:16px;margin:10px 0;border:1px solid #E7DFF8;box-shadow:0 2px 0 #E7DFF8}
.box h3{font-size:19px;margin-bottom:8px;font-weight:600}
.muted{color:var(--soft);font-size:14.5px;line-height:1.55}
.progress{display:flex;align-items:center;gap:16px}
.ringbig{--v:0;width:112px;height:112px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--lime) 0, #2FBF71 calc(var(--v)*1%), #EEE8FA 0)}
.ringbig div{width:88px;height:88px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;font-weight:700;font-size:30px;line-height:1}
.ringbig small{display:block;font-size:12px;font-weight:500;color:var(--soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{padding:7px 12px;border-radius:999px;border:2px solid #E2D9F7;background:#fff;font-size:14px;font-weight:600}
.chip.on{background:var(--violet);border-color:var(--violet);color:#fff}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F0EAFB}
.row:last-child{border-bottom:0}
.row .pic{width:52px;height:52px;border-radius:16px;background:#F3EEFF;display:grid;place-items:center;font-size:32px;flex:none;overflow:hidden}
.row .pic img{width:100%;height:100%;object-fit:cover}
.row .nm{flex:1;min-width:0;font-size:20px;font-weight:600}
.row .nm small{display:block;font-size:12px;color:var(--soft);font-weight:400}
.seg{display:flex;border:2px solid #E2D9F7;border-radius:12px;overflow:hidden;flex:none}
.seg button{padding:7px 8px;font-size:13px;font-weight:600;background:#fff;min-width:46px}
.seg button+button{border-right:2px solid #E2D9F7}
.seg button.s1{background:#FFE9A8}
.seg button.s2{background:#2FBF71;color:#fff}
.mini{width:40px;height:40px;border-radius:12px;background:#F3EEFF;font-size:20px;display:grid;place-items:center;flex:none;position:relative}
.mini.has::after{content:"";position:absolute;top:4px;left:4px;width:9px;height:9px;border-radius:50%;background:#2FBF71}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:14px;background:var(--sky2);color:#fff;font-weight:600;font-size:16px}
.btn.light{background:#fff;color:var(--ink);border:2px solid #E2D9F7}
.btn.warn{background:#E5484D}
.btn:active{opacity:.8}
.field{display:block;margin:10px 0}
.field span{display:block;font-size:14px;color:var(--soft);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:12px;border-radius:12px;border:2px solid #E2D9F7;background:#fff;font-size:17px;color:var(--ink)}
.tiplist{padding-inline-start:20px}
.tiplist li{margin:0 0 12px;line-height:1.6}
.tiplist b{color:var(--sky3)}
.moment{padding:10px 0;border-bottom:1px solid #F0EAFB;display:flex;gap:10px;align-items:baseline}
.moment time{font-size:12px;color:var(--soft);flex:none;width:72px}
.moment .x{margin-inline-start:auto;color:#C2B6DD;font-size:18px;padding:0 6px}
.warnbox{background:#FFF4E5;border:2px solid #FFC078;border-radius:16px;padding:12px 14px;margin:10px 0;font-size:15px;line-height:1.5}

/* ---------- modal / toast / fx ---------- */
.modal{position:fixed;inset:0;background:rgba(20,10,45,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.on{display:flex}
.sheet{background:#fff;color:var(--ink);width:100%;max-width:560px;border-radius:28px 28px 0 0;padding:20px 18px max(20px,env(safe-area-inset-bottom));
  max-height:92vh;overflow:auto;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.sheet h3{font-size:23px;margin-bottom:6px;font-weight:600}
.sheet .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.recdot{width:112px;height:112px;border-radius:50%;background:linear-gradient(180deg,#FF6B6B,#E5484D);color:#fff;font-size:20px;font-weight:700;margin:16px auto;display:grid;place-items:center;box-shadow:0 6px 0 #A52632}
.recdot.live{animation:recpulse 1s infinite}
@keyframes recpulse{50%{transform:scale(1.07);box-shadow:0 0 0 14px rgba(229,72,77,.18),0 6px 0 #A52632}}
video.cam{width:100%;border-radius:18px;background:#000;aspect-ratio:1;object-fit:cover}
.toast{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(30px);background:#fff;color:var(--ink);font-weight:600;
  padding:12px 18px;border-radius:16px;font-size:16px;opacity:0;transition:.25s;z-index:80;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.toast.on{opacity:1;transform:translateX(-50%)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.flash{position:fixed;inset:0;pointer-events:none;z-index:59;background:radial-gradient(circle,rgba(255,230,120,.55),transparent 65%);opacity:0}
.flash.go{animation:flash .7s ease-out}
@keyframes flash{20%{opacity:1}}
@media (prefers-reduced-motion: reduce){ .sky i{animation:none} }
</style>
</head>
<body>
<div class="sky" id="sky"></div>
<div class="flash" id="flash"></div>

<!-- ============ HOME ============ -->
<section class="screen on" id="home">
  <div class="gate" id="gate">
    <span class="ring"></span>
    <button class="icon-btn candy" aria-label="אזור הורים">⚙️</button>
    <div class="gate-hint">לחיצה ארוכה = הורים</div>
  </div>
  <div class="owl-wrap idle" id="homeOwl"></div>
  <div class="brand">פִּטְפּוּט</div><div class="brand-sub" id="brandSub">שֶׁל שַׁחַף</div>

const DB = (() => {
  let dbp = null;
  function open(){
    if(dbp) return dbp;
    dbp = new Promise((res, rej) => {
      if(!window.indexedDB) return rej("no idb");
      const r = indexedDB.open("pitput", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("media");
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  function tx(mode, fn){
    return open().then(db => new Promise((res, rej) => {
      const t = db.transaction("media", mode); const st = t.objectStore("media");
      const out = fn(st); t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error);
    }));
  }
  return {
    get: k => tx("readonly", st => st.get(k)).catch(()=>null),
    set: (k, v) => tx("readwrite", st => st.put(v, k)),
    del: k => tx("readwrite", st => st.delete(k)),
    keys: () => tx("readonly", st => st.getAllKeys()).catch(()=>[]),
  };
})();
// in-memory cache of which media exist, and object URLs
const media = {audio:new Map(), photo:new Map()};
async function loadMediaIndex(){
  const keys = await DB.keys() || [];
  for(const k of keys){
    const [id, kind] = String(k).split("|");
    const v = await DB.get(k);
    if(!v) continue;
    if(kind === "audio") media.audio.set(id, v instanceof Blob ? URL.createObjectURL(v) : v);
    if(kind === "photo") media.photo.set(id, v);
  }
}

const Speech = (() => {
  let n = 0; const pending = {};
  window.__ttsDone = id => { const f = pending[id]; if(f){ delete pending[id]; f(); } };
  let heVoice = null;
  function findVoice(){ if(!window.speechSynthesis) return; heVoice = speechSynthesis.getVoices().find(v => /^(he|iw)/i.test(v.lang)) || null; }
  if(window.speechSynthesis){ findVoice(); speechSynthesis.onvoiceschanged = findVoice; }
  function prep(text){ return settings.nikud ? text : stripNikud(text); }
  return {
    speak(text, {rate=settings.rate, pitch=1.12}={}){
      text = prep(text);
      return new Promise(res => {
        const fallback = setTimeout(() => res(), 1800 + text.length*140);
        const done = () => { clearTimeout(fallback); res(); };
        if(NATIVE && NATIVE.speak){
          const id = "u" + (++n); pending[id] = done;
          try{ NATIVE.speak(text, rate, pitch, id); }catch(e){ done(); }
        } else if(window.speechSynthesis){
          const u = new SpeechSynthesisUtterance(text); u.lang = "he-IL"; if(heVoice) u.voice = heVoice;
          u.rate = rate; u.pitch = pitch; u.onend = done; u.onerror = done;
          speechSynthesis.speak(u);
        } else done();
      });
    },
    stop(){ try{ NATIVE ? NATIVE.stopSpeaking() : (window.speechSynthesis && speechSynthesis.cancel()); }catch(e){} for(const k in pending){ pending[k](); } },
    status(){ try{ return NATIVE ? NATIVE.ttsStatus() : (window.speechSynthesis ? (heVoice ? "ready" : "web-no-hebrew") : "none"); }catch(e){ return "unknown"; } }
  };
})();

let actx = null;
function ac(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(actx && actx.state==="suspended") actx.resume(); return actx; }
function tone(freq, t0, dur, type="sine", vol=.18, slide=0){
  const c = ac(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain(); o.type = type;
  o.frequency.setValueAtTime(freq, c.currentTime+t0);
  if(slide) o.frequency.exponentialRampToValueAtTime(freq*slide, c.currentTime+t0+dur);
  g.gain.setValueAtTime(0.0001, c.currentTime+t0);
  g.gain.exponentialRampToValueAtTime(vol, c.currentTime+t0+.02);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+t0+dur);
  o.connect(g).connect(c.destination); o.start(c.currentTime+t0); o.stop(c.currentTime+t0+dur+.05);
}

  pop(){ tone(420, 0, .18, "sine", .22, 2.2); },
  whoosh(){ tone(900, 0, .35, "triangle", .08, .35); },
  chime(){ [523,659,784,1047].forEach((f,i)=>tone(f, i*.09, .35, "triangle", .14)); },

const FX = (() => {
  const cv = $("#fx"), cx = cv.getContext("2d"); let parts = [], raf = 0;
  function size(){ cv.width = innerWidth*devicePixelRatio; cv.height = innerHeight*devicePixelRatio; }
  addEventListener("resize", size); size();
  function loop(){
    cx.clearRect(0,0,cv.width,cv.height);
    parts = parts.filter(p => p.life > 0);
    for(const p of parts){
      p.vy += .25*devicePixelRatio; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life--;
      cx.save(); cx.globalAlpha = Math.min(1, p.life/30); cx.translate(p.x, p.y); cx.rotate(p.r);
      cx.font = `${p.s}px sans-serif`; cx.textAlign="center"; cx.textBaseline="middle"; cx.fillText(p.e, 0, 0); cx.restore();
    }
    raf = parts.length ? requestAnimationFrame(loop) : 0;
  }
  return {
    burst(emojis=["⭐","🎉","💛","✨","🌟","🎈"], n=36){
      const d = devicePixelRatio;
      for(let i=0;i<n;i++) parts.push({e:pick(emojis), x:innerWidth/2*d, y:innerHeight*.45*d,
        vx:(Math.random()-.5)*22*d, vy:(-Math.random()*16-6)*d, r:0, vr:(Math.random()-.5)*.3,
        s:(26+Math.random()*26)*d, life:70+Math.random()*40});
      if(!raf) loop();
    }
  };
})();

/* =====================================================================
   MIC: listens for ANY vocal attempt (energy-based, not speech recognition —
   toddler words aren't recognizable by ASR, and every attempt deserves a party)
   ===================================================================== */
const Mic = (() => {
  let stream = null, an = null, buf = null, src = null, state = "off"; // off|ok|denied
  async function start(){
    if(state === "ok") return true;
    try{
      stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true}});
      const c = ac(); src = c.createMediaStreamSource(stream); an = c.createAnalyser(); an.fftSize = 1024;
      buf = new Float32Array(an.fftSize); src.connect(an); state = "ok"; return true;
    }catch(e){ state = "denied"; return false; }
  }
  function stop(){ if(stream){ stream.getTracks().forEach(t => t.stop()); } stream = null; an = null; state = state==="denied" ? "denied" : "off"; }
  function level(){
    if(!an) return 0; an.getFloatTimeDomainData(buf);
    let s = 0; for(let i=0;i<buf.length;i++) s += buf[i]*buf[i];
    return Math.sqrt(s/buf.length);
  }
  // resolves "voice" when sustained energy above adaptive threshold, "timeout" otherwise, "cancel" if token changes
  function listen(ms, onLevel, token){
    return new Promise(async res => {
      if(state !== "ok"){ const t0=Date.now(); while(Date.now()-t0<ms){ if(token.dead) return res("cancel"); await sleep(100);} return res("timeout"); }
      const mult = {low:4.5, mid:3.2, high:2.2}[settings.sens] || 3.2;
      const floorMin = {low:.03, mid:.018, high:.011}[settings.sens] || .018;
      const t0 = performance.now(); const calib = []; let above = 0, last = t0;
      const tick = () => {
        if(token.dead){ onLevel(0); return res("cancel"); }
        const now = performance.now(), dt = now - last; last = now;
        const lv = level();
        if(now - t0 < 350){ calib.push(lv); onLevel(0); return requestAnimationFrame(tick); }
        const base = calib.length ? calib.sort((a,b)=>a-b)[Math.floor(calib.length/2)] : 0;
        const thr = Math.max(base*mult, floorMin);
        onLevel(Math.min(1, lv/(thr*2.2)));
        above = lv > thr ? above + dt : Math.max(0, above - dt*.5);
        if(above > 140){ onLevel(0); return res("voice"); }
        if(now - t0 > ms){ onLevel(0); return res("timeout"); }
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
  }
  return {start, stop, listen, get state(){ return state; }};
})();

// long-press helper (parent gate)
function longPress(node, ms, onDone, onProgress){
  let t0 = 0, raf = 0;
  const step = () => { const p = Math.min(1, (performance.now()-t0)/ms); onProgress && onProgress(p); if(p >= 1){ end(); onDone(); } else raf = requestAnimationFrame(step); };
  const startP = e => { e.preventDefault(); t0 = performance.now(); raf = requestAnimationFrame(step); };
  const end = () => { cancelAnimationFrame(raf); onProgress && onProgress(0); };
  node.addEventListener("pointerdown", startP); node.addEventListener("pointerup", end);
  node.addEventListener("pointerleave", end); node.addEventListener("pointercancel", end);
}

/* =====================================================================
   MODE 1: EXPLORE ("מה זה?")
   ===================================================================== */
let exList = [], exIdx = 0;
function cardHTML(w, showSound=true, anim="pop"){
  return `<div class="card ${anim}" style="${candyVars(w.cat)}">
    <div class="spot"></div>
    <div class="pic">${picHTML(w)}</div>
    <div class="word">${esc(wordText(w))}</div>
    <div class="snd">${showSound && w.s ? esc(w.s) : ""}</div></div>`;
}
function startExplore(){
  exList = curCat ? poolFor(curCat) : shuffle(allWords()).slice(0, 15);
  exIdx = 0; go("explore"); showExplore("pop");
}
function showExplore(anim){
  const w = exList[exIdx];
  $("#exStage").innerHTML = cardHTML(w, true, anim);
  const card = $("#exStage .card");
  card.addEventListener("click", () => { bounce(card); sfx.pop(); sayWord(w); });
  swipe(card, dir => exGo(dir));
  const dots = $("#exDots"); dots.innerHTML = exList.length <= 20 ? exList.map((_, i) => `<i class="${i===exIdx?"on":""}"></i>`).join("") : `<b>${exIdx+1}/${exList.length}</b>`;
  stopAllSound(); setTimeout(() => cur === "explore" && sayWord(w), 350);
}
function exGo(d){
  sfx.whoosh(); exIdx = (exIdx + d + exList.length) % exList.length;
  if(exIdx === 0 && d > 0){ FX.burst(); fxPlay("_magic", .8); }
  showExplore(d > 0 ? "in-next" : "in-prev");
}
$("#exNext").onclick = () => exGo(1);
$("#exPrev").onclick = () => exGo(-1);
$("#exSay").onclick = () => { const c = $("#exStage .card"); bounce(c); sayWord(exList[exIdx]); };
function bounce(card){ if(!card) return; card.classList.remove("boing","pop","in-next","in-prev"); void card.offsetWidth; card.classList.add("boing"); }
// RTL book feel: swiping toward the right (finger moves right) = next page
function swipe(node, cb){
  let x0 = null;
  node.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, {passive:true});
  node.addEventListener("touchend", e => {
    if(x0 == null) return;
    const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if(Math.abs(dx) > 60) cb(dx > 0 ? 1 : -1);
  });
}

/* =====================================================================
   MODE 2: YOUR TURN ("תורך!")
   Show picture -> ask "מה זה?" -> the seagull WAITS & listens (the pause is the point) ->
   any voice = party + model the word back (expansion). Silence = model the word,
   then a second, shorter wait. Prioritises words he understands but doesn't say yet.
   ===================================================================== */
let tuList = [], tuIdx = 0, tuWord = null;
function turnPool(){
  const pool = poolFor(curCat);
  const st = w => (diary[w.id] && diary[w.id].s) || 0;
  const understands = shuffle(pool.filter(w => st(w) === 1));
  const fresh = shuffle(pool.filter(w => st(w) === 0));
  const known = shuffle(pool.filter(w => st(w) === 2));
  // mostly "almost-there" words, then new ones, sprinkle known ones for easy wins
  const out = [];
  while(out.length < 12 && (understands.length || fresh.length || known.length)){
    if(understands.length) out.push(understands.shift());
    if(fresh.length) out.push(fresh.shift());
    if(out.length % 4 === 3 && known.length) out.push(known.shift());
    if(!understands.length && !fresh.length && known.length) out.push(known.shift());
  }
  return out;
}
async function startTurn(){
  tuList = turnPool(); tuIdx = 0; go("turn");
  $("#tuPrompt").textContent = "";
  const ok = await Mic.start();
  if(!ok) toast("בלי מיקרופון: לחצו ⭐ כשהוא אומר מילה", 3500);
  runTurn();
}
function setLevel(v){
  const o = $("#tuOwl"); if(o) o.style.setProperty("--lvl", v.toFixed(2));
  const c = $("#tuStage .card"); if(c) c.style.transform = `scale(${1 + v*0.07}) rotate(${(v*3).toFixed(1)}deg)`;
}
async function listenPhase(pr, text, ms, tok){
  pr.textContent = text; Owl.state("#tuOwl", "listen");
  const r = await Mic.listen(ms, setLevel, tok);
  if(r !== "cancel") Owl.state("#tuOwl", "idle");
  return r;
}
async function runTurn(){
  killFlow(); const tok = flowToken;
  if(tuIdx >= tuList.length){ tuList = turnPool(); tuIdx = 0; }
  const w = tuWord = tuList[tuIdx];
  Owl.state("#tuOwl", "idle");
  $("#tuStage").innerHTML = cardHTML(w, false, tuIdx ? "in-next" : "pop");
  const card = $("#tuStage .card"), pr = $("#tuPrompt");
  card.addEventListener("click", () => { bounce(card); sfx.pop(); });
  swipe(card, () => tuNext());
  const wordEl = card.querySelector(".word"); wordEl.style.visibility = "hidden";
  await sleep(500); if(tok.dead) return;
  pr.textContent = "מָה זֶה? 🤔";
  await sayPhrase("__whatis", WHATIS); if(tok.dead) return;
  let r = await listenPhase(pr, "מַקְשִׁיב... 👂", 6500, tok); if(r === "cancel") return;
  if(r === "voice"){ await celebrate(w, tok, false); return; }
  // model the word, then give him another chance
  wordEl.style.visibility = "visible"; bounce(card); pr.textContent = "";
  await sayWord(w); if(tok.dead) return;
  await sleep(250); if(tok.dead) return;
  r = await listenPhase(pr, "עַכְשָׁו אַתָּה! 👂", 4500, tok); if(r === "cancel") return;
  if(r === "voice"){ await celebrate(w, tok, false); return; }
  pr.textContent = ""; await sleep(900); if(tok.dead) return;
  tuIdx++; runTurn();
}
function flash(){ const f = $("#flash"); f.classList.remove("go"); void f.offsetWidth; f.classList.add("go"); }
async function celebrate(w, tok, fromParent){
  const card = $("#tuStage .card"); const pr = $("#tuPrompt");
  setLevel(0);
  if(card){ card.querySelector(".word").style.visibility = "visible"; bounce(card); }
  fxPlay("_claps", .9); fxPlay("_cheer", .45); FX.burst(); flash(); Owl.party("#tuOwl");
  pr.textContent = "🎉 יֵשׁ!";
  const p = pick(PRAISE);
  await sayPhrase("__praise", Math.random() < .35 ? `${p.replace("!","")} ${childName()}!` : p); if(tok.dead) return;
  await sleep(150);
  await sayWord(w); if(tok.dead) return;   // expansion: he hears the target word right after his attempt
  const att = LS.get("attempts", {}); att[w.id] = (att[w.id]||0) + 1; LS.set("attempts", att);
  if(fromParent) markSaid(w.id);
  await sleep(1200); if(tok.dead) return;
  tuIdx++; runTurn();
}
function tuNext(){ sfx.whoosh(); tuIdx++; runTurn(); }
$("#tuNext").onclick = tuNext;
$("#tuAgain").onclick = () => {
  if(!tuWord) return; killFlow(); const tok = flowToken; const c = $("#tuStage .card");
  if(c){ c.querySelector(".word").style.visibility = "visible"; bounce(c); }
  const pr = $("#tuPrompt");
  sayWord(tuWord).then(async () => {
    if(tok.dead) return;
    const r = await listenPhase(pr, "עַכְשָׁו אַתָּה! 👂", 5000, tok);
    if(r === "voice") celebrate(tuWord, tok, false); else if(r === "timeout") pr.textContent = "";
  });
};
$("#tuSaid").onclick = () => { if(!tuWord) return; killFlow(); celebrate(tuWord, flowToken, true); };
function markSaid(id){
  const d = diary[id] || (diary[id] = {s:0});
  if(d.s !== 2){ d.s = 2; d.d2 = today(); if(!d.d1) d.d1 = d.d2; saveDiary(); const n = Object.values(diary).filter(x=>x.s===2).length; toast(`נרשם ביומן ⭐ (${n} מילים)`); milestone(n); }
}
function milestone(n){
  if([10,25,50,75,100,150,200].includes(n)){ setTimeout(()=>{ FX.burst(["🏆","🎉","⭐","🥳"], 60); toast(`🏆 ${n} מילים! איזה אלוף!`, 4000); }, 600); }
}

function dealPeek(){
  const pool = shuffle(poolFor(curCat)).slice(0, 6);
  const g = $("#peekGrid"); g.innerHTML = ""; let opened = 0;
  pool.forEach((w, i) => {
    const h = el("button", {class:"hole"}, `<div class="pic">${picHTML(w)}</div><div class="w">${esc(wordText(w))}</div><div class="cloud"><span style="animation-delay:${i*.3}s">☁️</span></div>`);

      await Speech.speak("קוּקוּ!", {pitch:1.3}); await sayWord(w);

    g.appendChild(h);

// ---------- recorder ----------
let rec = null, recChunks = [], recStream = null, recTimer = 0;
function stopRec(discard){
  clearTimeout(recTimer);
  if(rec && rec.state !== "inactive"){ rec._discard = !!discard; try{ rec.stop(); }catch(e){} }
  if(recStream){ recStream.getTracks().forEach(t => t.stop()); recStream = null; }
}
function openRecorder(w){
  const has = media.audio.has(w.id);
  openModal(`<h3>🎙️ ${esc(wordText(w))}</h3>
    <div class="muted">לחצו על העיגול ואמרו את המילה בקול שמח וברור${w.s ? ` — אפשר להוסיף גם "${esc(w.s)}"` : ""}. ההקלטה נעצרת לבד אחרי 4 שניות.</div>
    <button class="recdot" id="recBtn">הקלטה</button>
    <div class="acts"><button class="btn light" id="recPlay" ${has?"":"disabled style='opacity:.4'"}>▶ השמעה</button>
    <button class="btn warn" id="recDel" ${has?"":"disabled style='opacity:.4'"}>🗑️ מחיקה</button>
    <button class="btn light" id="recClose">סגירה</button></div>`);
  $("#recClose").onclick = closeModal;
  $("#recPlay").onclick = () => media.audio.has(w.id) && playUrl(media.audio.get(w.id));
  $("#recDel").onclick = async () => { await DB.del(w.id+"|audio"); media.audio.delete(w.id); toast("ההקלטה נמחקה"); closeModal(); };
  $("#recBtn").onclick = async () => {
    const btn = $("#recBtn");
    if(rec && rec.state === "recording"){ stopRec(false); return; }
    try{
      recStream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}});
    }catch(e){ toast("אין הרשאת מיקרופון"); return; }
    const mime = ["audio/webm;codecs=opus","audio/webm","audio/mp4"].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
    rec = new MediaRecorder(recStream, mime ? {mimeType:mime} : undefined); recChunks = [];
    rec.ondataavailable = e => e.data.size && recChunks.push(e.data);
    rec.onstop = async () => {
      btn.classList.remove("live"); btn.textContent = "הקלטה";
      if(recStream){ recStream.getTracks().forEach(t => t.stop()); recStream = null; }
      if(rec._discard || !recChunks.length) return;
      const blob = new Blob(recChunks, {type: rec.mimeType || "audio/webm"});
      await DB.set(w.id+"|audio", blob);
      const old = media.audio.get(w.id); if(old && old.startsWith("blob:")) URL.revokeObjectURL(old);
      media.audio.set(w.id, URL.createObjectURL(blob));
      sfx.chime(); toast("נשמר! 💛");
      ["recPlay","recDel"].forEach(id => { const b = $("#"+id); if(b){ b.disabled = false; b.style.opacity = 1; } });
      await sleep(200); playUrl(media.audio.get(w.id));
    };
    rec.start(); btn.classList.add("live"); btn.textContent = "■ עצירה";
    recTimer = setTimeout(() => stopRec(false), 4000);
  };
}

// ---------- camera ----------
let camStream = null;
function closeCam(){ if(camStream){ camStream.getTracks().forEach(t => t.stop()); camStream = null; } }
async function savePhoto(w, dataUrl){
  await DB.set(w.id+"|photo", dataUrl); media.photo.set(w.id, dataUrl); sfx.chime(); toast("התמונה נשמרה 📸"); closeModal();
}
function squareJpeg(src, sw, sh){
  const s = Math.min(sw, sh), cv = document.createElement("canvas"); cv.width = cv.height = 480;
  cv.getContext("2d").drawImage(src, (sw-s)/2, (sh-s)/2, s, s, 0, 0, 480, 480);
  return cv.toDataURL("image/jpeg", .82);
}
async function openCamera(w){
  const has = media.photo.has(w.id);
  openModal(`<h3>📷 ${esc(wordText(w))}</h3>
    <div class="muted">צלמו את הדבר האמיתי מהעולם שלו: הכוס שלו, הכלב של סבתא, סבתא עצמה 🙂</div>
    <video class="cam" id="camV" autoplay playsinline muted style="margin-top:10px"></video>
    <div class="acts"><button class="btn" id="camShot">📸 צילום</button>
    <button class="btn light" id="camFlip">🔄</button>
    <button class="btn light" id="camGal">🖼️ מהגלריה</button>
    ${has ? `<button class="btn warn" id="camDel">🗑️</button>` : ""}
    <button class="btn light" id="camClose">סגירה</button></div>`);
  let facing = "environment";
  const startCam = async () => {
    closeCam();
    try{ camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:facing, width:{ideal:960}, height:{ideal:960}}, audio:false}); $("#camV").srcObject = camStream; }
    catch(e){ toast("אין גישה למצלמה — אפשר לבחור מהגלריה"); }
  };
  startCam();
  $("#camFlip").onclick = () => { facing = facing === "environment" ? "user" : "environment"; startCam(); };
  $("#camClose").onclick = closeModal;
  $("#camShot").onclick = () => { const v = $("#camV"); if(!v.videoWidth) return; sfx.pop(); savePhoto(w, squareJpeg(v, v.videoWidth, v.videoHeight)); };
  $("#camGal").onclick = () => { const f = $("#fileImage"); f.value = ""; f.onchange = () => {
      const file = f.files[0]; if(!file) return; const img = new Image();
      img.onload = () => { savePhoto(w, squareJpeg(img, img.naturalWidth, img.naturalHeight)); URL.revokeObjectURL(img.src); };
      img.src = URL.createObjectURL(file); }; f.click(); };
  if(has) $("#camDel").onclick = async () => { await DB.del(w.id+"|photo"); media.photo.delete(w.id); toast("התמונה נמחקה"); closeModal(); };
}

    <label class="field"><span>המילה (אפשר עם ניקוד)</span><input id="nwW" maxlength="24"></label>

async function deleteCustom(w){
  if(!confirm(`למחוק את "${stripNikud(w.w)}"?`)) return;
  OURS.words = OURS.words.filter(x => x.id !== w.id); saveCustom();
  await DB.del(w.id+"|audio"); await DB.del(w.id+"|photo"); media.audio.delete(w.id); media.photo.delete(w.id);
  delete diary[w.id]; saveDiary(); renderWords();
}

// ---------- settings + backup ----------
function renderSettings(){
  const st = Speech.status();
  const ttsWarn = (st === "no-hebrew" || st === "web-no-hebrew" || st === "none")
    ? `<div class="warnbox">⚠️ לא נמצא קול עברי במנוע ההקראה של הטלפון. התקינו "Speech Services by Google" ובחרו בה עברית (הורדת נתוני קול).<br>${NATIVE && NATIVE.openTtsSettings ? `<button class="btn" id="ttsSet" style="margin-top:8px">פתיחת הגדרות הקראה</button>` : ""}<br>בינתיים — הקלטות שלכם עובדות תמיד.</div>` : "";
  $("#p-settings").innerHTML = `
    ${ttsWarn}
    <div class="box"><h3>הילד</h3>
      <label class="field"><span>השם שלו (עם ניקוד אם אפשר — כך ההקראה מדויקת)</span><input id="sName" value="${esc(settings.name)}" placeholder="למשל: יוֹנָתָן"></label>
      <div class="muted">השם מופיע ככרטיס בקטגוריית משפחה ובשבחים ("כל הכבוד יונתן!"). צלמו אותו שם 📷 — ילדים מתים לראות את עצמם.</div></div>
    <div class="box"><h3>זמן משחק</h3>
      <div class="chips" id="sMin">${[5,10,15,20,0].map(m => `<button class="chip ${settings.minutes===m?"on":""}" data-v="${m}">${m ? m+" דק'" : "ללא הגבלה"}</button>`).join("")}</div>
      <div class="muted">ההמלצה לגיל הזה: מעט מסך, תמיד יחד. בסוף הזמן השחף נרדם, ורק הורה (לחיצה ארוכה) מעיר אותו.</div></div>
    <div class="box"><h3>קול</h3>
      <div class="chips" id="sVoice"><button class="chip ${settings.voice==="parent"?"on":""}" data-v="parent">ההקלטות שלנו קודם</button><button class="chip ${settings.voice==="tts"?"on":""}" data-v="tts">רק קול ממוחשב</button></div>
      <div class="chips" id="sRate">${[[0.7,"איטי מאוד"],[0.85,"איטי"],[1,"רגיל"]].map(([v,l]) => `<button class="chip ${settings.rate===v?"on":""}" data-v="${v}">${l}</button>`).join("")}</div>
      <div class="chips" id="sNik"><button class="chip ${settings.nikud?"on":""}" data-v="1">הקראה עם ניקוד</button><button class="chip ${!settings.nikud?"on":""}" data-v="0">בלי ניקוד</button></div>
      <button class="btn light" id="sTest">🔊 בדיקה</button></div>
    <div class="box"><h3>רגישות המיקרופון ב"תורך!"</h3>
      <div class="chips" id="sSens">${[["low","נמוכה (בית רועש)"],["mid","רגילה"],["high","גבוהה (לחישות)"]].map(([v,l]) => `<button class="chip ${settings.sens===v?"on":""}" data-v="${v}">${l}</button>`).join("")}</div>
      <div class="muted">האפליקציה לא מנסה "להבין" את המילה — היא מזהה שהוא <b>ניסה</b>, וזה מה שחוגגים.</div></div>
    <div class="box"><h3>💞 סנכרון בין הטלפונים</h3>
      <div class="muted">ייצאו קובץ (יומן, הקלטות, תמונות ומילים) ושלחו בווטסאפ לטלפון השני. שם: "ייבוא" → בוחרים את הקובץ. הייבוא ממזג — לא מוחק כלום.</div>
      <div class="acts" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn" id="bExp">📤 ייצוא ושיתוף</button><button class="btn light" id="bImp">📥 ייבוא</button></div></div>
    <div class="box"><div class="muted">פטפוט של שחף · גרסה 1.2 · הכל נשמר מקומית בטלפון, בלי אינטרנט, בלי פרסומות, בלי איסוף מידע.</div></div>`;
  const bindChips = (id, key, conv) => $("#"+id).querySelectorAll(".chip").forEach(b => b.onclick = () => { settings[key] = conv(b.dataset.v); saveSettings(); renderSettings(); });
  bindChips("sMin", "minutes", Number); bindChips("sVoice", "voice", String); bindChips("sRate", "rate", Number);
  bindChips("sSens", "sens", String); bindChips("sNik", "nikud", v => v === "1");
  $("#sName").onchange = e => { settings.name = e.target.value.trim(); saveSettings(); toast("נשמר"); };
  $("#sTest").onclick = () => Speech.speak(`שָׁלוֹם ${childName()}! כֶּלֶב! הַב הַב!`);
  const ts = $("#ttsSet"); if(ts) ts.onclick = () => NATIVE.openTtsSettings();
  $("#bExp").onclick = exportAll; $("#bImp").onclick = () => { const f = $("#fileImport"); f.value = ""; f.onchange = () => f.files[0] && importAll(f.files[0]); f.click(); };
}
const blobToDataURL = b => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); });
async function exportAll(){
  toast("מכין קובץ...");
  const keys = await DB.keys() || []; const m = {};
  for(const k of keys){ const v = await DB.get(k); if(v) m[k] = v instanceof Blob ? await blobToDataURL(v) : v; }
  const data = {app:"pitput", v:1, at:new Date().toISOString(), settings, diary, moments, custom:OURS.words, attempts:LS.get("attempts",{}), media:m};
  const json = JSON.stringify(data);
  const name = `pitput-${today()}.json`;
  if(NATIVE && NATIVE.shareFile){ NATIVE.shareFile(name, json); }
  else { const a = el("a", {href:URL.createObjectURL(new Blob([json], {type:"application/json"})), download:name}); document.body.appendChild(a); a.click(); a.remove(); }
}
async function dataURLToBlob(u){ return (await fetch(u)).blob(); }
async function importAll(file){
  try{
    const data = JSON.parse(await file.text());
    if(data.app !== "pitput") throw 0;
    // merge diary: keep the "higher" status and the earliest dates
    for(const [id, d] of Object.entries(data.diary || {})){
      const mine = diary[id];
      if(!mine){ diary[id] = d; continue; }
      if((d.s||0) > (mine.s||0)) mine.s = d.s;
      for(const k of ["d1","d2"]) if(d[k] && (!mine[k] || d[k] < mine[k])) mine[k] = d[k];
    }
    saveDiary();
    const seen = new Set(moments.map(m => m.t + m.txt));
    for(const mm of data.moments || []) if(!seen.has(mm.t + mm.txt)) moments.push(mm);
    moments.sort((a,b) => a.t - b.t); saveMoments();
    for(const cw of data.custom || []) if(!OURS.words.find(x => x.id === cw.id)) OURS.words.push(cw);
    saveCustom();
    const att = LS.get("attempts", {}); for(const [k,v] of Object.entries(data.attempts||{})) att[k] = Math.max(att[k]||0, v); LS.set("attempts", att);
    if(!settings.name && data.settings && data.settings.name){ settings.name = data.settings.name; saveSettings(); }
    let n = 0;
    for(const [k, v] of Object.entries(data.media || {})){
      const [id, kind] = k.split("|");
      if(kind === "audio"){ const b = await dataURLToBlob(v); await DB.set(k, b); media.audio.set(id, URL.createObjectURL(b)); n++; }
      if(kind === "photo"){ await DB.set(k, v); media.photo.set(id, v); n++; }
    }
    sfx.chime(); FX.burst(["💞","💛","⭐"]); toast(`יובא! ${n} הקלטות ותמונות 💞`, 3000); renderParent();
  }catch(e){ toast("הקובץ לא נראה כמו גיבוי של פטפוט"); }
}

});
loadMediaIndex().finally(() => renderHome());
renderHome();
