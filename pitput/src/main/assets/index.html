<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFF4E0">
<title>פטפוט</title>
<style>
:root{
  --bg:#FFF4E0; --ink:#3B2F2F; --soft:#8A7B6F; --card:#FFFFFF; --accent:#FF8A5B; --accent2:#5BC0BE;
  --ok:#6BCB77; --line:#EADBC8; --shadow:0 6px 0 rgba(59,47,47,.12), 0 10px 24px rgba(59,47,47,.10);
  --r:28px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Rubik","Noto Sans Hebrew","Assistant",system-ui,sans-serif;overscroll-behavior:none}
body{user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
input,select,textarea{font:inherit;user-select:text;-webkit-user-select:text}
.screen{position:fixed;inset:0;display:none;flex-direction:column;
  padding:max(14px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom))}
.screen.on{display:flex}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:56px}
.icon-btn{width:56px;height:56px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);
  font-size:28px;display:grid;place-items:center;flex:none}
.icon-btn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(59,47,47,.12)}
h1,h2,h3{margin:0}
.grow{flex:1;min-height:0}

/* ---------- home ---------- */
#home{align-items:center}
.mascot{font-size:110px;line-height:1;margin-top:4vh;animation:float 3.2s ease-in-out infinite;filter:drop-shadow(0 10px 8px rgba(0,0,0,.12))}
@keyframes float{50%{transform:translateY(-10px) rotate(-3deg)}}
.brand{font-size:44px;font-weight:800;letter-spacing:-.5px;margin-top:6px}
.hello{color:var(--soft);font-size:18px;margin-top:2px;text-align:center}
.modes{display:grid;gap:14px;width:100%;max-width:520px;margin-top:3vh}
.mode{display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:var(--r);box-shadow:var(--shadow);
  font-size:28px;font-weight:800;text-align:right}
.mode .e{font-size:46px}
.mode small{display:block;font-size:15px;font-weight:500;opacity:.75}
.mode:active{transform:translateY(4px) scale(.99)}
.tip{margin-top:auto;width:100%;max-width:520px;background:#ffffffaa;border:2px dashed var(--line);
  border-radius:20px;padding:12px 14px;font-size:15px;line-height:1.45;color:#5b4d43}
.tip b{color:var(--accent)}
.gate{position:absolute;top:max(14px,env(safe-area-inset-top));left:16px}
.gate .ring{position:absolute;inset:-4px;border-radius:50%;
  background:conic-gradient(var(--accent) calc(var(--p,0)*1%), transparent 0);
  -webkit-mask:radial-gradient(circle, transparent 58%, #000 60%);mask:radial-gradient(circle, transparent 58%, #000 60%)}
.gate .icon-btn{position:relative;font-size:24px;opacity:.75}
.gate-hint{position:absolute;top:64px;left:0;white-space:nowrap;font-size:12px;color:var(--soft);opacity:0;transition:.3s}
.gate.hint .gate-hint{opacity:1}

/* ---------- categories ---------- */
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;overflow:auto;padding:6px 2px 20px;align-content:start}
.cat{border-radius:var(--r);box-shadow:var(--shadow);padding:16px 8px;display:flex;flex-direction:column;
  align-items:center;gap:4px;font-size:22px;font-weight:800}
.cat .e{font-size:58px;line-height:1.1}
.cat:active{transform:translateY(4px)}
.title{font-size:26px;font-weight:800}

/* ---------- word card ---------- */
.stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0}
.card{width:min(84vw,430px);aspect-ratio:3/3.6;background:var(--card);border-radius:40px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;position:relative;
  border:6px solid var(--cc,#FFD6A5);transition:transform .12s}
.card .pic{font-size:min(38vw,190px);line-height:1;display:grid;place-items:center;width:78%;aspect-ratio:1}
.card .pic img{width:100%;height:100%;object-fit:cover;border-radius:28px}
.card .word{font-size:min(13vw,62px);font-weight:800;letter-spacing:.5px}
.card .snd{font-size:22px;color:var(--soft);min-height:1.2em}
.card.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6) rotate(-6deg);opacity:0}100%{transform:none;opacity:1}}
.card.boing .pic{animation:boing .6s}
@keyframes boing{30%{transform:scale(1.18,.86)}55%{transform:scale(.92,1.1) translateY(-14px)}80%{transform:scale(1.03,.98)}}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:10px}
.big-arrow{width:86px;height:86px;border-radius:50%;background:var(--accent);color:#fff;font-size:44px;
  box-shadow:0 6px 0 #d0643a;display:grid;place-items:center}
.big-arrow:active{transform:translateY(4px);box-shadow:0 2px 0 #d0643a}
.big-arrow.alt{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:50vw}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}

/* ---------- turn mode ---------- */
.ear{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);width:84px;height:84px;border-radius:50%;
  background:#fff;box-shadow:var(--shadow);display:grid;place-items:center;font-size:42px;opacity:0;transition:opacity .3s}
.ear.on{opacity:1}
.ear::before{content:"";position:absolute;inset:0;border-radius:50%;border:5px solid var(--accent2);
  transform:scale(calc(1 + var(--lvl,0)*0.9));opacity:calc(.25 + var(--lvl,0));transition:transform .08s}
.ear.wait::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px dashed var(--accent2);animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.parent-bar{display:flex;gap:10px;justify-content:center;padding-top:22px}
.pill{padding:12px 18px;border-radius:999px;background:#fff;box-shadow:var(--shadow);font-size:17px;font-weight:700}
.pill.ok{background:var(--ok);color:#fff;box-shadow:0 5px 0 #4a9c55}
.pill:active{transform:translateY(3px)}
.prompt{font-size:24px;font-weight:800;text-align:center;min-height:36px;color:var(--soft)}

/* ---------- peekaboo ---------- */
.peek{flex:1;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,1fr);gap:14px;padding:10px 0}
.hole{position:relative;border-radius:var(--r);background:#fff;box-shadow:var(--shadow);overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center}
.hole .pic{font-size:min(18vw,84px);line-height:1;width:70%;aspect-ratio:1;display:grid;place-items:center}
.hole .pic img{width:100%;height:100%;object-fit:cover;border-radius:18px}
.hole .w{font-size:22px;font-weight:800;opacity:0;transition:.3s .2s}
.hole.open .w{opacity:1}
.cloud{position:absolute;inset:0;display:grid;place-items:center;font-size:min(22vw,96px);
  background:linear-gradient(160deg,#BDE0FE,#A2D2FF);transition:transform .6s cubic-bezier(.5,-0.4,.6,1),opacity .6s}
.cloud span{animation:float 2.6s ease-in-out infinite}
.hole.open .cloud{transform:translateY(-120%) scale(.6) rotate(-14deg);opacity:0}
.hole.open .pic{animation:boing .7s .15s}

/* ---------- bye ---------- */
#bye{align-items:center;justify-content:center;text-align:center;gap:16px}
#bye .mascot{font-size:140px}
#bye h2{font-size:38px}

/* ---------- parent area ---------- */
#parent{padding-left:0;padding-right:0;background:#FBF7F2}
#parent .top{padding:0 16px}
.tabs{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;flex:none}
.tab{padding:10px 14px;border-radius:999px;background:#fff;border:2px solid var(--line);font-weight:700;font-size:15px;white-space:nowrap}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pane{flex:1;overflow:auto;padding:4px 16px 40px;display:none}
.pane.on{display:block}
.box{background:#fff;border-radius:20px;padding:16px;margin:10px 0;border:1px solid var(--line)}
.box h3{font-size:18px;margin-bottom:8px}
.muted{color:var(--soft);font-size:14px;line-height:1.5}
.progress{display:flex;align-items:center;gap:16px}
.ringbig{--v:0;width:112px;height:112px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--ok) calc(var(--v)*1%), #eee 0)}
.ringbig div{width:88px;height:88px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;font-weight:800;font-size:28px;line-height:1}
.ringbig small{display:block;font-size:12px;font-weight:500;color:var(--soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{padding:7px 12px;border-radius:999px;border:2px solid var(--line);background:#fff;font-size:14px;font-weight:700}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f1e8dd}
.row:last-child{border-bottom:0}
.row .pic{width:52px;height:52px;border-radius:14px;background:#FFF4E0;display:grid;place-items:center;font-size:32px;flex:none;overflow:hidden}
.row .pic img{width:100%;height:100%;object-fit:cover}
.row .nm{flex:1;min-width:0;font-size:19px;font-weight:700}
.row .nm small{display:block;font-size:12px;color:var(--soft);font-weight:500}
.seg{display:flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;flex:none}
.seg button{padding:7px 8px;font-size:13px;font-weight:700;background:#fff;min-width:44px}
.seg button+button{border-right:2px solid var(--line)}
.seg button.s1{background:#FFE8A3}
.seg button.s2{background:var(--ok);color:#fff}
.mini{width:40px;height:40px;border-radius:12px;background:#f6efe6;font-size:20px;display:grid;place-items:center;flex:none;position:relative}
.mini.has::after{content:"";position:absolute;top:4px;left:4px;width:9px;height:9px;border-radius:50%;background:var(--ok)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:14px;background:var(--ink);color:#fff;font-weight:700;font-size:16px}
.btn.light{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.warn{background:#E76F51}
.btn:active{opacity:.8}
.field{display:block;margin:10px 0}
.field span{display:block;font-size:14px;color:var(--soft);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:17px}
.tiplist li{margin:0 0 12px;line-height:1.55}
.tiplist b{color:var(--accent)}
.moment{padding:10px 0;border-bottom:1px solid #f1e8dd;display:flex;gap:10px;align-items:baseline}
.moment time{font-size:12px;color:var(--soft);flex:none;width:72px}
.moment .x{margin-inline-start:auto;color:#c9b9a8;font-size:18px;padding:0 6px}
.warnbox{background:#FFF1E6;border:2px solid #FFB38A;border-radius:16px;padding:12px 14px;margin:10px 0;font-size:15px;line-height:1.5}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(40,30,25,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.on{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:20px 18px max(20px,env(safe-area-inset-bottom));
  max-height:92vh;overflow:auto;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.sheet h3{font-size:22px;margin-bottom:6px}
.sheet .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.recdot{width:110px;height:110px;border-radius:50%;background:#E63946;color:#fff;font-size:20px;font-weight:800;margin:16px auto;display:grid;place-items:center;box-shadow:0 6px 0 #a52632}
.recdot.live{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.07);box-shadow:0 0 0 14px rgba(230,57,70,.18),0 6px 0 #a52632}}
video.cam{width:100%;border-radius:18px;background:#000;aspect-ratio:1;object-fit:cover}
.toast{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;
  padding:12px 18px;border-radius:14px;font-size:15px;opacity:0;transition:.25s;z-index:80;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
</style>
</head>
<body>

<!-- ============ HOME ============ -->
<section class="screen on" id="home">
  <div class="gate" id="gate">
    <span class="ring"></span>
    <button class="icon-btn" aria-label="אזור הורים">⚙️</button>
    <div class="gate-hint">לחיצה ארוכה = הורים</div>
  </div>
  <div class="mascot" id="mascot">🦉</div>
  <div class="brand">פִּטְפּוּט</div>
  <div class="hello" id="hello">משחקים יחד, מדברים יחד</div>
  <div class="modes">
    <button class="mode" style="background:#FFD6A5" data-mode="explore"><span class="e">🔍</span><span>מָה זֶה?<small>מסתכלים, שומעים, אומרים</small></span></button>
    <button class="mode" style="background:#CAFFBF" data-mode="turn"><span class="e">🎤</span><span>תּוֹרְךָ!<small>האפליקציה מקשיבה ומחכה לו</small></span></button>
    <button class="mode" style="background:#BDE0FE" data-mode="peek"><span class="e">☁️</span><span>קוּקוּ!<small>מה מתחבא מאחורי הענן?</small></span></button>
  </div>
  <div class="tip" id="homeTip"></div>
</section>

<!-- ============ CATEGORIES ============ -->
<section class="screen" id="cats">
  <div class="top">
    <button class="icon-btn" data-go="home">🏠</button>
    <div class="title" id="catsTitle"></div>
    <div style="width:56px"></div>
  </div>
  <div class="cats" id="catGrid"></div>
</section>

<!-- ============ EXPLORE ============ -->
<section class="screen" id="explore">
  <div class="top">
    <button class="icon-btn" data-go="cats">↩️</button>
    <div class="dots" id="exDots"></div>
    <button class="icon-btn" data-go="home">🏠</button>
  </div>
  <div class="stage" id="exStage"></div>
  <div class="nav">
    <button class="big-arrow alt" id="exPrev" aria-label="הקודם">➜</button>
    <button class="big-arrow alt" id="exSay" aria-label="שוב">🔊</button>
    <button class="big-arrow" id="exNext" aria-label="הבא"><span style="display:inline-block;transform:scaleX(-1)">➜</span></button>
  </div>
</section>

<!-- ============ TURN ============ -->
<section class="screen" id="turn">
  <div class="top">
    <button class="icon-btn" data-go="cats">↩️</button>
    <div class="prompt" id="tuPrompt"></div>
    <button class="icon-btn" data-go="home">🏠</button>
  </div>
  <div class="stage" id="tuStage"></div>
  <div class="parent-bar">
    <button class="pill" id="tuAgain">🔊 שוב</button>
    <button class="pill ok" id="tuSaid">⭐ אמר!</button>
    <button class="pill" id="tuNext">הבא ⏭</button>
  </div>
</section>

<!-- ============ PEEK ============ -->
<section class="screen" id="peek">
  <div class="top">
    <button class="icon-btn" data-go="cats">↩️</button>
    <div class="title">קוּקוּ! 👀</div>
    <button class="icon-btn" data-go="home">🏠</button>
  </div>
  <div class="peek" id="peekGrid"></div>
</section>

<!-- ============ BYE ============ -->
<section class="screen" id="bye">
  <div class="mascot">😴</div>
  <h2>בַּי בַּי!</h2>
  <div class="hello">שיחקנו מספיק למסך. עכשיו בואו נמצא את המילים בבית! 🏡</div>
  <button class="pill" id="byeMore" style="margin-top:20px">עוד קצת (לחיצה ארוכה של הורה)</button>
</section>

<!-- ============ PARENT ============ -->
<section class="screen" id="parent">
  <div class="top">
    <button class="icon-btn" data-go="home">🏠</button>
    <div class="title">אזור הורים</div>
    <div style="width:56px"></div>
  </div>
  <div class="tabs" id="ptabs">
    <button class="tab on" data-p="diary">📒 יומן</button>
    <button class="tab" data-p="words">🎙️ מילים</button>
    <button class="tab" data-p="tips">💡 טיפים</button>
    <button class="tab" data-p="settings">⚙️ הגדרות</button>
  </div>
  <div class="pane on" id="p-diary"></div>
  <div class="pane" id="p-words"></div>
  <div class="pane" id="p-tips"></div>
  <div class="pane" id="p-settings"></div>
</section>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<canvas id="fx"></canvas>
<input type="file" id="fileImport" accept="application/json,.json,*/*" hidden>
<input type="file" id="fileImage" accept="image/*" hidden>

const DB = (() => {
  let dbp = null;
  function open(){
    if(dbp) return dbp;
    dbp = new Promise((res, rej) => {
      if(!window.indexedDB) return rej("no idb");
      const r = indexedDB.open("pitput", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("media");
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  function tx(mode, fn){
    return open().then(db => new Promise((res, rej) => {
      const t = db.transaction("media", mode); const st = t.objectStore("media");
      const out = fn(st); t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error);
    }));
  }
  return {
    get: k => tx("readonly", st => st.get(k)).catch(()=>null),
    set: (k, v) => tx("readwrite", st => st.put(v, k)),
    del: k => tx("readwrite", st => st.delete(k)),
    keys: () => tx("readonly", st => st.getAllKeys()).catch(()=>[]),
  };
})();
// in-memory cache of which media exist, and object URLs
const media = {audio:new Map(), photo:new Map()};
async function loadMediaIndex(){
  const keys = await DB.keys() || [];
  for(const k of keys){
    const [id, kind] = String(k).split("|");
    const v = await DB.get(k);
    if(!v) continue;
    if(kind === "audio") media.audio.set(id, v instanceof Blob ? URL.createObjectURL(v) : v);
    if(kind === "photo") media.photo.set(id, v);
  }
}

   AUDIO: TTS (native bridge -> Android TextToSpeech, or Web Speech), recordings, sfx
   ===================================================================== */
const Speech = (() => {
  let n = 0; const pending = {};
  window.__ttsDone = id => { const f = pending[id]; if(f){ delete pending[id]; f(); } };
  let heVoice = null;
  function findVoice(){ if(!window.speechSynthesis) return; heVoice = speechSynthesis.getVoices().find(v => /^(he|iw)/i.test(v.lang)) || null; }
  if(window.speechSynthesis){ findVoice(); speechSynthesis.onvoiceschanged = findVoice; }
  function prep(text){ return settings.nikud ? text : stripNikud(text); }
  return {
    speak(text, {rate=settings.rate, pitch=1.12}={}){
      text = prep(text);
      return new Promise(res => {
        const fallback = setTimeout(() => res(), 1800 + text.length*140);
        const done = () => { clearTimeout(fallback); res(); };
        if(NATIVE && NATIVE.speak){
          const id = "u" + (++n); pending[id] = done;
          try{ NATIVE.speak(text, rate, pitch, id); }catch(e){ done(); }
        } else if(window.speechSynthesis){
          const u = new SpeechSynthesisUtterance(text); u.lang = "he-IL"; if(heVoice) u.voice = heVoice;
          u.rate = rate; u.pitch = pitch; u.onend = done; u.onerror = done;
          speechSynthesis.speak(u);
        } else done();
      });
    },
    stop(){ try{ NATIVE ? NATIVE.stopSpeaking() : (window.speechSynthesis && speechSynthesis.cancel()); }catch(e){} for(const k in pending){ pending[k](); } },
    status(){ try{ return NATIVE ? NATIVE.ttsStatus() : (window.speechSynthesis ? (heVoice ? "ready" : "web-no-hebrew") : "none"); }catch(e){ return "unknown"; } }
  };
})();

let curAudio = null;

    stopAudio();
    const a = new Audio(url); curAudio = a;
    const done = () => { if(curAudio === a) curAudio = null; res(); };
    a.onended = done; a.onerror = done;
    a.play().catch(done);
    setTimeout(done, 8000);

}

// sfx (WebAudio)
let actx = null;
function ac(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(actx && actx.state==="suspended") actx.resume(); return actx; }
function tone(freq, t0, dur, type="sine", vol=.18, slide=0){
  const c = ac(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain(); o.type = type;
  o.frequency.setValueAtTime(freq, c.currentTime+t0);
  if(slide) o.frequency.exponentialRampToValueAtTime(freq*slide, c.currentTime+t0+dur);
  g.gain.setValueAtTime(0.0001, c.currentTime+t0);
  g.gain.exponentialRampToValueAtTime(vol, c.currentTime+t0+.02);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+t0+dur);
  o.connect(g).connect(c.destination); o.start(c.currentTime+t0); o.stop(c.currentTime+t0+dur+.05);
}
const sfx = {
  pop(){ tone(420, 0, .18, "sine", .22, 2.2); },
  whoosh(){ tone(900, 0, .35, "triangle", .08, .35); },
  chime(){ [523,659,784,1047].forEach((f,i)=>tone(f, i*.09, .35, "triangle", .14)); },

};

   ===================================================================== */
const FX = (() => {
  const cv = $("#fx"), cx = cv.getContext("2d"); let parts = [], raf = 0;
  function size(){ cv.width = innerWidth*devicePixelRatio; cv.height = innerHeight*devicePixelRatio; }
  addEventListener("resize", size); size();
  function loop(){
    cx.clearRect(0,0,cv.width,cv.height);
    parts = parts.filter(p => p.life > 0);
    for(const p of parts){
      p.vy += .25*devicePixelRatio; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life--;
      cx.save(); cx.globalAlpha = Math.min(1, p.life/30); cx.translate(p.x, p.y); cx.rotate(p.r);
      cx.font = `${p.s}px sans-serif`; cx.textAlign="center"; cx.textBaseline="middle"; cx.fillText(p.e, 0, 0); cx.restore();
    }
    raf = parts.length ? requestAnimationFrame(loop) : 0;
  }
  return {
    burst(emojis=["⭐","🎉","💛","✨","🌟","🎈"], n=36){
      const d = devicePixelRatio;
      for(let i=0;i<n;i++) parts.push({e:pick(emojis), x:innerWidth/2*d, y:innerHeight*.45*d,
        vx:(Math.random()-.5)*22*d, vy:(-Math.random()*16-6)*d, r:0, vr:(Math.random()-.5)*.3,
        s:(26+Math.random()*26)*d, life:70+Math.random()*40});
      if(!raf) loop();
    }
  };
})();

/* =====================================================================
   MIC: listens for ANY vocal attempt (energy-based, not speech recognition —
   toddler words aren't recognizable by ASR, and every attempt deserves a party)
   ===================================================================== */
const Mic = (() => {
  let stream = null, an = null, buf = null, src = null, state = "off"; // off|ok|denied
  async function start(){
    if(state === "ok") return true;
    try{
      stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true}});
      const c = ac(); src = c.createMediaStreamSource(stream); an = c.createAnalyser(); an.fftSize = 1024;
      buf = new Float32Array(an.fftSize); src.connect(an); state = "ok"; return true;
    }catch(e){ state = "denied"; return false; }
  }
  function stop(){ if(stream){ stream.getTracks().forEach(t => t.stop()); } stream = null; an = null; state = state==="denied" ? "denied" : "off"; }
  function level(){
    if(!an) return 0; an.getFloatTimeDomainData(buf);
    let s = 0; for(let i=0;i<buf.length;i++) s += buf[i]*buf[i];
    return Math.sqrt(s/buf.length);
  }
  // resolves "voice" when sustained energy above adaptive threshold, "timeout" otherwise, "cancel" if token changes
  function listen(ms, onLevel, token){
    return new Promise(async res => {
      if(state !== "ok"){ const t0=Date.now(); while(Date.now()-t0<ms){ if(token.dead) return res("cancel"); await sleep(100);} return res("timeout"); }
      const mult = {low:4.5, mid:3.2, high:2.2}[settings.sens] || 3.2;
      const floorMin = {low:.03, mid:.018, high:.011}[settings.sens] || .018;
      const t0 = performance.now(); const calib = []; let above = 0, last = t0;
      const tick = () => {
        if(token.dead){ onLevel(0); return res("cancel"); }
        const now = performance.now(), dt = now - last; last = now;
        const lv = level();
        if(now - t0 < 350){ calib.push(lv); onLevel(0); return requestAnimationFrame(tick); }
        const base = calib.length ? calib.sort((a,b)=>a-b)[Math.floor(calib.length/2)] : 0;
        const thr = Math.max(base*mult, floorMin);
        onLevel(Math.min(1, lv/(thr*2.2)));
        above = lv > thr ? above + dt : Math.max(0, above - dt*.5);
        if(above > 140){ onLevel(0); return res("voice"); }
        if(now - t0 > ms){ onLevel(0); return res("timeout"); }
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
  }
  return {start, stop, listen, get state(){ return state; }};
})();

  const now = Date.now(), dt = now - lastTick; lastTick = now;
  if(KID.has(cur) && !document.hidden){
    playMs += dt;
    if(settings.minutes > 0 && playMs > settings.minutes*60000) go("bye");
  }
}, 1000);

function killFlow(){ flowToken.dead = true; flowToken = {dead:false}; stopAllSound(); }
function go(id){
  if(id !== cur) killFlow();
  if(cur === "turn" && id !== "turn") Mic.stop();
  if(cur === "parent" && id !== "parent") closeCam();
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id));
  cur = id;
  if(id === "home") renderHome();
  if(id === "cats") renderCats();
  if(id === "parent") renderParent();
  if(id === "bye"){ Speech.speak("בַּי בַּי! נְשַׂחֵק עוֹד מְעַט"); }
  try{ NATIVE && NATIVE.setKeepScreenOn && NATIVE.setKeepScreenOn(KID.has(id)); }catch(e){}
}

  const g = e.target.closest("[data-go]"); if(g){ sfx.tick(); go(g.dataset.go); }
});

// Android back button (called from native). Return true if handled.
let lastBack = 0;
window.pitputBack = () => {
  if($("#modal").classList.contains("on")){ closeModal(); return true; }
  if(cur === "home"){
    if(Date.now() - lastBack < 2000) return false;
    lastBack = Date.now(); toast("לחצו שוב על 'חזור' כדי לצאת"); return true;
  }
  if(cur === "bye") return true; // toddler-proof
  if(cur === "explore" || cur === "turn" || cur === "peek"){ go("cats"); return true; }
  go("home"); return true;
};

// long-press helper (parent gate)
function longPress(node, ms, onDone, onProgress){
  let t0 = 0, raf = 0;
  const step = () => { const p = Math.min(1, (performance.now()-t0)/ms); onProgress && onProgress(p); if(p >= 1){ end(); onDone(); } else raf = requestAnimationFrame(step); };
  const startP = e => { e.preventDefault(); t0 = performance.now(); raf = requestAnimationFrame(step); };
  const end = () => { cancelAnimationFrame(raf); onProgress && onProgress(0); };
  node.addEventListener("pointerdown", startP); node.addEventListener("pointerup", end);
  node.addEventListener("pointerleave", end); node.addEventListener("pointercancel", end);
}

/* =====================================================================
   MODE 1: EXPLORE ("מה זה?")
   ===================================================================== */
let exList = [], exIdx = 0;
function cardHTML(w, showSound=true){
  return `<div class="card pop" style="--cc:${w.cat.c}">
    <div class="pic">${picHTML(w)}</div>
    <div class="word">${esc(wordText(w))}</div>
    <div class="snd">${showSound && w.s ? esc(w.s) : ""}</div>
    <div class="ear" id="ear">👂</div></div>`;
}
function startExplore(){
  exList = curCat ? poolFor(curCat) : shuffle(allWords()).slice(0, 15);
  exIdx = 0; go("explore"); showExplore();
}
function showExplore(){
  const w = exList[exIdx];
  $("#exStage").innerHTML = cardHTML(w);
  const card = $("#exStage .card");
  card.addEventListener("click", () => { bounce(card); sfx.pop(); sayWord(w); });
  swipe(card, dir => { dir > 0 ? exGo(1) : exGo(-1); });
  const dots = $("#exDots"); dots.innerHTML = exList.length <= 20 ? exList.map((_, i) => `<i class="${i===exIdx?"on":""}"></i>`).join("") : `<b>${exIdx+1}/${exList.length}</b>`;
  stopAllSound(); setTimeout(() => cur === "explore" && sayWord(w), 350);
}
function exGo(d){ sfx.whoosh(); exIdx = (exIdx + d + exList.length) % exList.length; if(exIdx === 0 && d > 0){ FX.burst(); sfx.chime(); } showExplore(); }
$("#exNext").onclick = () => exGo(1);
$("#exPrev").onclick = () => exGo(-1);
$("#exSay").onclick = () => { const c = $("#exStage .card"); bounce(c); sayWord(exList[exIdx]); };
function bounce(card){ card.classList.remove("boing","pop"); void card.offsetWidth; card.classList.add("boing"); }
function swipe(node, cb){
  let x0 = null;
  node.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, {passive:true});
  node.addEventListener("touchend", e => { if(x0 == null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if(Math.abs(dx) > 60) cb(dx > 0 ? 1 : -1); // RTL: swipe right = forward });
}

/* =====================================================================
   MODE 2: YOUR TURN ("תורך!")
   Show picture -> ask "מה זה?" -> WAIT & listen (the pause is the point) ->
   any voice = party + model the word back (expansion). Silence = model the word,
   then a second, shorter wait. Prioritises words he understands but doesn't say yet.
   ===================================================================== */
let tuList = [], tuIdx = 0, tuWord = null;
function turnPool(){
  const pool = poolFor(curCat);
  const st = w => (diary[w.id] && diary[w.id].s) || 0;
  const understands = shuffle(pool.filter(w => st(w) === 1));
  const fresh = shuffle(pool.filter(w => st(w) === 0));
  const known = shuffle(pool.filter(w => st(w) === 2));
  // mostly "almost-there" words, then new ones, sprinkle known ones for easy wins
  const out = [];
  while(out.length < 12 && (understands.length || fresh.length || known.length)){
    if(understands.length) out.push(understands.shift());
    if(fresh.length) out.push(fresh.shift());
    if(out.length % 4 === 3 && known.length) out.push(known.shift());
    if(!understands.length && !fresh.length && known.length) out.push(known.shift());
  }
  return out;
}
async function startTurn(){
  tuList = turnPool(); tuIdx = 0; go("turn");
  $("#tuPrompt").textContent = "";
  const ok = await Mic.start();
  if(!ok) toast("בלי מיקרופון: לחצו ⭐ כשהוא אומר מילה", 3500);
  runTurn();
}
function setLevel(v){ const e = $("#ear"); if(e) e.style.setProperty("--lvl", v.toFixed(2)); const c = $("#tuStage .card"); if(c) c.style.transform = `scale(${1 + v*0.06})`; }
async function runTurn(){
  killFlow(); const tok = flowToken;
  if(tuIdx >= tuList.length){ tuList = turnPool(); tuIdx = 0; }
  const w = tuWord = tuList[tuIdx];
  $("#tuStage").innerHTML = cardHTML(w, false);
  const card = $("#tuStage .card"), ear = $("#ear"), pr = $("#tuPrompt");
  card.addEventListener("click", () => { bounce(card); sfx.pop(); });
  swipe(card, () => tuNext());
  const wordEl = card.querySelector(".word"); wordEl.style.visibility = "hidden";
  await sleep(500); if(tok.dead) return;
  pr.textContent = "מָה זֶה? 🤔";
  await sayPhrase("__whatis", WHATIS); if(tok.dead) return;
  ear.classList.add("on","wait"); pr.textContent = "מַקְשִׁיבִים... 👂";
  let r = await Mic.listen(6500, setLevel, tok); if(r === "cancel") return;
  ear.classList.remove("wait");
  if(r === "voice"){ await celebrate(w, tok, false); return; }
  // model the word, then give him another chance
  wordEl.style.visibility = "visible"; bounce(card); pr.textContent = "";
  await sayWord(w); if(tok.dead) return;
  await sleep(250); if(tok.dead) return;
  pr.textContent = "עַכְשָׁו אַתָּה! 👂"; ear.classList.add("wait");
  r = await Mic.listen(4500, setLevel, tok); if(r === "cancel") return;
  ear.classList.remove("on","wait");
  if(r === "voice"){ await celebrate(w, tok, false); return; }
  pr.textContent = ""; await sleep(900); if(tok.dead) return;
  tuIdx++; runTurn();
}
async function celebrate(w, tok, fromParent){
  const card = $("#tuStage .card"); const pr = $("#tuPrompt");
  const ear = $("#ear"); ear && ear.classList.remove("on","wait");
  if(card){ card.querySelector(".word").style.visibility = "visible"; bounce(card); }
  sfx.chime(); FX.burst();
  pr.textContent = "🎉";
  const p = pick(PRAISE);
  await sayPhrase("__praise", Math.random() < .35 ? `${p.replace("!","")} ${childName()}!` : p); if(tok.dead) return;
  await sleep(150);
  await sayWord(w); if(tok.dead) return;   // expansion: he hears the target word right after his attempt
  // remember attempts for the parent
  const att = LS.get("attempts", {}); att[w.id] = (att[w.id]||0) + 1; LS.set("attempts", att);
  if(fromParent) markSaid(w.id);
  await sleep(1200); if(tok.dead) return;
  tuIdx++; runTurn();
}
function tuNext(){ sfx.whoosh(); tuIdx++; runTurn(); }
$("#tuNext").onclick = tuNext;
$("#tuAgain").onclick = () => { if(!tuWord) return; killFlow(); const tok = flowToken; const c = $("#tuStage .card"); if(c){ c.querySelector(".word").style.visibility="visible"; bounce(c); }
  sayWord(tuWord).then(async () => { if(tok.dead) return; const ear=$("#ear"); ear && ear.classList.add("on","wait"); $("#tuPrompt").textContent = "עַכְשָׁו אַתָּה! 👂";
    const r = await Mic.listen(5000, setLevel, tok); if(r==="voice") celebrate(tuWord, tok, false); else if(r==="timeout"){ ear && ear.classList.remove("on","wait"); $("#tuPrompt").textContent=""; } }); };
$("#tuSaid").onclick = () => { if(!tuWord) return; killFlow(); celebrate(tuWord, flowToken, true); };
function markSaid(id){
  const d = diary[id] || (diary[id] = {s:0});
  if(d.s !== 2){ d.s = 2; d.d2 = today(); if(!d.d1) d.d1 = d.d2; saveDiary(); const n = Object.values(diary).filter(x=>x.s===2).length; toast(`נרשם ביומן ⭐ (${n} מילים)`); milestone(n); }
}
function milestone(n){
  if([10,25,50,75,100,150,200].includes(n)){ setTimeout(()=>{ FX.burst(["🏆","🎉","⭐","🥳"], 60); toast(`🏆 ${n} מילים! איזה אלוף!`, 4000); }, 600); }
}

/* =====================================================================

async function startPeek(){
  go("peek"); dealPeek();
}
function dealPeek(){
  const pool = shuffle(poolFor(curCat)).slice(0, 6);
  const g = $("#peekGrid"); g.innerHTML = ""; let opened = 0;
  pool.forEach((w, i) => {
    const h = el("button", {class:"hole"}, `<div class="pic">${picHTML(w)}</div><div class="w">${esc(wordText(w))}</div><div class="cloud"><span style="animation-delay:${i*.3}s">☁️</span></div>`);
    h.onclick = async () => {
      if(h.classList.contains("open")){ sfx.pop(); sayWord(w); return; }
      h.classList.add("open"); sfx.whoosh(); opened++;
      stopAllSound();
      await Speech.speak("קוּקוּ!", {pitch:1.3}); await sayWord(w);
      if(opened === pool.length){ await sleep(400); FX.burst(); sfx.chime(); await Speech.speak("יֵשׁ! מָצָאנוּ אֶת כֻּלָּם!"); await sleep(1400); if(cur === "peek") dealPeek(); }
    };
    g.appendChild(h);
  });
  if(pool.length < 6) g.style.gridTemplateRows = `repeat(${Math.ceil(pool.length/2)},1fr)`; else g.style.gridTemplateRows = "";
}

// ---------- words & voices ----------

  const c = cats.find(c => c.id === wordsFilter);

    <div class="box"><h3>הקול שלכם > קול רובוטי</h3>
      <div class="muted">ילדים מגיבים הכי טוב לקול של אמא ואבא. הקליטו כל מילה (🎙️), צלמו את החפץ האמיתי שלו (📷), וסמנו: <b>מבין</b> = מצביע/מגיב, <b>אומר</b> = אומר בעצמו (גם "תוּ" על תפוח נחשב!).</div>
      <div class="acts" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
        <button class="btn light" data-special="__whatis">🎙️ "מה זה?" בקול שלכם</button>
        <button class="btn light" data-special="__praise">🎙️ "כל הכבוד!" בקול שלכם</button>
        <button class="btn" id="addWord">➕ מילה משלנו</button>
      </div>
    </div>
    <div class="chips">${cats.map(x => `<button class="chip ${x.id===wordsFilter?"on":""}" data-f="${x.id}">${x.e} ${esc(x.name)}</button>`).join("")}</div>

  $("#addWord").onclick = openAddWord;
  const rows = $("#wordRows");
  for(const w0 of c.words){

      <div class="pic">${picHTML(w)}</div>

      <button class="mini ${media.audio.has(w.id)?"has":""}" data-a="rec">🎙️</button>
      <button class="mini ${media.photo.has(w.id)?"has":""}" data-a="pic">📷</button>`);
    r.querySelector(".nm").onclick = () => sayWord(w);

      saveDiary(); renderWords();

// ---------- recorder ----------
let rec = null, recChunks = [], recStream = null, recTimer = 0;
function stopRec(discard){
  clearTimeout(recTimer);
  if(rec && rec.state !== "inactive"){ rec._discard = !!discard; try{ rec.stop(); }catch(e){} }
  if(recStream){ recStream.getTracks().forEach(t => t.stop()); recStream = null; }
}
function openRecorder(w){
  const has = media.audio.has(w.id);
  openModal(`<h3>🎙️ ${esc(wordText(w))}</h3>
    <div class="muted">לחצו על העיגול ואמרו את המילה בקול שמח וברור${w.s ? ` — אפשר להוסיף גם "${esc(w.s)}"` : ""}. ההקלטה נעצרת לבד אחרי 4 שניות.</div>
    <button class="recdot" id="recBtn">הקלטה</button>
    <div class="acts"><button class="btn light" id="recPlay" ${has?"":"disabled style='opacity:.4'"}>▶ השמעה</button>
    <button class="btn warn" id="recDel" ${has?"":"disabled style='opacity:.4'"}>🗑️ מחיקה</button>
    <button class="btn light" id="recClose">סגירה</button></div>`);
  $("#recClose").onclick = closeModal;
  $("#recPlay").onclick = () => media.audio.has(w.id) && playUrl(media.audio.get(w.id));
  $("#recDel").onclick = async () => { await DB.del(w.id+"|audio"); media.audio.delete(w.id); toast("ההקלטה נמחקה"); closeModal(); };
  $("#recBtn").onclick = async () => {
    const btn = $("#recBtn");
    if(rec && rec.state === "recording"){ stopRec(false); return; }
    try{
      recStream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}});
    }catch(e){ toast("אין הרשאת מיקרופון"); return; }
    const mime = ["audio/webm;codecs=opus","audio/webm","audio/mp4"].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
    rec = new MediaRecorder(recStream, mime ? {mimeType:mime} : undefined); recChunks = [];
    rec.ondataavailable = e => e.data.size && recChunks.push(e.data);
    rec.onstop = async () => {
      btn.classList.remove("live"); btn.textContent = "הקלטה";
      if(recStream){ recStream.getTracks().forEach(t => t.stop()); recStream = null; }
      if(rec._discard || !recChunks.length) return;
      const blob = new Blob(recChunks, {type: rec.mimeType || "audio/webm"});
      await DB.set(w.id+"|audio", blob);
      const old = media.audio.get(w.id); if(old && old.startsWith("blob:")) URL.revokeObjectURL(old);
      media.audio.set(w.id, URL.createObjectURL(blob));
      sfx.chime(); toast("נשמר! 💛");
      ["recPlay","recDel"].forEach(id => { const b = $("#"+id); if(b){ b.disabled = false; b.style.opacity = 1; } });
      await sleep(200); playUrl(media.audio.get(w.id));
    };
    rec.start(); btn.classList.add("live"); btn.textContent = "■ עצירה";
    recTimer = setTimeout(() => stopRec(false), 4000);
  };
}

// ---------- camera ----------
let camStream = null;
function closeCam(){ if(camStream){ camStream.getTracks().forEach(t => t.stop()); camStream = null; } }
async function savePhoto(w, dataUrl){
  await DB.set(w.id+"|photo", dataUrl); media.photo.set(w.id, dataUrl); sfx.chime(); toast("התמונה נשמרה 📸"); closeModal();
}
function squareJpeg(src, sw, sh){
  const s = Math.min(sw, sh), cv = document.createElement("canvas"); cv.width = cv.height = 480;
  cv.getContext("2d").drawImage(src, (sw-s)/2, (sh-s)/2, s, s, 0, 0, 480, 480);
  return cv.toDataURL("image/jpeg", .82);
}
async function openCamera(w){
  const has = media.photo.has(w.id);
  openModal(`<h3>📷 ${esc(wordText(w))}</h3>
    <div class="muted">צלמו את הדבר האמיתי מהעולם שלו: הכוס שלו, הכלב של סבתא, סבתא עצמה 🙂</div>
    <video class="cam" id="camV" autoplay playsinline muted style="margin-top:10px"></video>
    <div class="acts"><button class="btn" id="camShot">📸 צילום</button>
    <button class="btn light" id="camFlip">🔄</button>
    <button class="btn light" id="camGal">🖼️ מהגלריה</button>
    ${has ? `<button class="btn warn" id="camDel">🗑️</button>` : ""}
    <button class="btn light" id="camClose">סגירה</button></div>`);
  let facing = "environment";
  const startCam = async () => {
    closeCam();
    try{ camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:facing, width:{ideal:960}, height:{ideal:960}}, audio:false}); $("#camV").srcObject = camStream; }
    catch(e){ toast("אין גישה למצלמה — אפשר לבחור מהגלריה"); }
  };
  startCam();
  $("#camFlip").onclick = () => { facing = facing === "environment" ? "user" : "environment"; startCam(); };
  $("#camClose").onclick = closeModal;
  $("#camShot").onclick = () => { const v = $("#camV"); if(!v.videoWidth) return; sfx.pop(); savePhoto(w, squareJpeg(v, v.videoWidth, v.videoHeight)); };
  $("#camGal").onclick = () => { const f = $("#fileImage"); f.value = ""; f.onchange = () => {
      const file = f.files[0]; if(!file) return; const img = new Image();
      img.onload = () => { savePhoto(w, squareJpeg(img, img.naturalWidth, img.naturalHeight)); URL.revokeObjectURL(img.src); };
      img.src = URL.createObjectURL(file); }; f.click(); };
  if(has) $("#camDel").onclick = async () => { await DB.del(w.id+"|photo"); media.photo.delete(w.id); toast("התמונה נמחקה"); closeModal(); };
}

async function deleteCustom(w){
  if(!confirm(`למחוק את "${stripNikud(w.w)}"?`)) return;
  OURS.words = OURS.words.filter(x => x.id !== w.id); saveCustom();
  await DB.del(w.id+"|audio"); await DB.del(w.id+"|photo"); media.audio.delete(w.id); media.photo.delete(w.id);
  delete diary[w.id]; saveDiary(); renderWords();
}

// ---------- settings + backup ----------
function renderSettings(){
  const st = Speech.status();
  const ttsWarn = (st === "no-hebrew" || st === "web-no-hebrew" || st === "none")
    ? `<div class="warnbox">⚠️ לא נמצא קול עברי במנוע ההקראה של הטלפון. התקינו "Speech Services by Google" ובחרו בה עברית (הורדת נתוני קול).<br>${NATIVE && NATIVE.openTtsSettings ? `<button class="btn" id="ttsSet" style="margin-top:8px">פתיחת הגדרות הקראה</button>` : ""}<br>בינתיים — הקלטות שלכם עובדות תמיד.</div>` : "";
  $("#p-settings").innerHTML = `
    ${ttsWarn}
    <div class="box"><h3>הילד</h3>
      <label class="field"><span>השם שלו (עם ניקוד אם אפשר — כך ההקראה מדויקת)</span><input id="sName" value="${esc(settings.name)}" placeholder="למשל: יוֹנָתָן"></label>
      <div class="muted">השם מופיע ככרטיס בקטגוריית משפחה ובשבחים ("כל הכבוד יונתן!"). צלמו אותו שם 📷 — ילדים מתים לראות את עצמם.</div></div>
    <div class="box"><h3>זמן משחק</h3>
      <div class="chips" id="sMin">${[5,10,15,20,0].map(m => `<button class="chip ${settings.minutes===m?"on":""}" data-v="${m}">${m ? m+" דק'" : "ללא הגבלה"}</button>`).join("")}</div>
      <div class="muted">ההמלצה לגיל הזה: מעט מסך, תמיד יחד. בסוף הזמן הינשוף נרדם, ורק הורה (לחיצה ארוכה) מעיר אותו.</div></div>
    <div class="box"><h3>קול</h3>
      <div class="chips" id="sVoice"><button class="chip ${settings.voice==="parent"?"on":""}" data-v="parent">ההקלטות שלנו קודם</button><button class="chip ${settings.voice==="tts"?"on":""}" data-v="tts">רק קול ממוחשב</button></div>
      <div class="chips" id="sRate">${[[0.7,"איטי מאוד"],[0.85,"איטי"],[1,"רגיל"]].map(([v,l]) => `<button class="chip ${settings.rate===v?"on":""}" data-v="${v}">${l}</button>`).join("")}</div>
      <div class="chips" id="sNik"><button class="chip ${settings.nikud?"on":""}" data-v="1">הקראה עם ניקוד</button><button class="chip ${!settings.nikud?"on":""}" data-v="0">בלי ניקוד</button></div>
      <button class="btn light" id="sTest">🔊 בדיקה</button></div>
    <div class="box"><h3>רגישות המיקרופון ב"תורך!"</h3>
      <div class="chips" id="sSens">${[["low","נמוכה (בית רועש)"],["mid","רגילה"],["high","גבוהה (לחישות)"]].map(([v,l]) => `<button class="chip ${settings.sens===v?"on":""}" data-v="${v}">${l}</button>`).join("")}</div>
      <div class="muted">האפליקציה לא מנסה "להבין" את המילה — היא מזהה שהוא <b>ניסה</b>, וזה מה שחוגגים.</div></div>
    <div class="box"><h3>💞 סנכרון בין הטלפונים</h3>
      <div class="muted">ייצאו קובץ (יומן, הקלטות, תמונות ומילים) ושלחו בווטסאפ לטלפון השני. שם: "ייבוא" → בוחרים את הקובץ. הייבוא ממזג — לא מוחק כלום.</div>
      <div class="acts" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn" id="bExp">📤 ייצוא ושיתוף</button><button class="btn light" id="bImp">📥 ייבוא</button></div></div>
    <div class="box"><div class="muted">פטפוט · גרסה 1.0 · הכל נשמר מקומית בטלפון, בלי אינטרנט, בלי פרסומות, בלי איסוף מידע.</div></div>`;
  const bindChips = (id, key, conv) => $("#"+id).querySelectorAll(".chip").forEach(b => b.onclick = () => { settings[key] = conv(b.dataset.v); saveSettings(); renderSettings(); });
  bindChips("sMin", "minutes", Number); bindChips("sVoice", "voice", String); bindChips("sRate", "rate", Number);
  bindChips("sSens", "sens", String); bindChips("sNik", "nikud", v => v === "1");
  $("#sName").onchange = e => { settings.name = e.target.value.trim(); saveSettings(); toast("נשמר"); };
  $("#sTest").onclick = () => Speech.speak(`שָׁלוֹם ${childName()}! כֶּלֶב! הַב הַב!`);
  const ts = $("#ttsSet"); if(ts) ts.onclick = () => NATIVE.openTtsSettings();
  $("#bExp").onclick = exportAll; $("#bImp").onclick = () => { const f = $("#fileImport"); f.value = ""; f.onchange = () => f.files[0] && importAll(f.files[0]); f.click(); };
}
const blobToDataURL = b => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); });
async function exportAll(){
  toast("מכין קובץ...");
  const keys = await DB.keys() || []; const m = {};
  for(const k of keys){ const v = await DB.get(k); if(v) m[k] = v instanceof Blob ? await blobToDataURL(v) : v; }
  const data = {app:"pitput", v:1, at:new Date().toISOString(), settings, diary, moments, custom:OURS.words, attempts:LS.get("attempts",{}), media:m};
  const json = JSON.stringify(data);
  const name = `pitput-${today()}.json`;
  if(NATIVE && NATIVE.shareFile){ NATIVE.shareFile(name, json); }
  else { const a = el("a", {href:URL.createObjectURL(new Blob([json], {type:"application/json"})), download:name}); document.body.appendChild(a); a.click(); a.remove(); }
}
async function dataURLToBlob(u){ return (await fetch(u)).blob(); }
async function importAll(file){
  try{
    const data = JSON.parse(await file.text());
    if(data.app !== "pitput") throw 0;
    // merge diary: keep the "higher" status and the earliest dates
    for(const [id, d] of Object.entries(data.diary || {})){
      const mine = diary[id];
      if(!mine){ diary[id] = d; continue; }
      if((d.s||0) > (mine.s||0)) mine.s = d.s;
      for(const k of ["d1","d2"]) if(d[k] && (!mine[k] || d[k] < mine[k])) mine[k] = d[k];
    }
    saveDiary();
    const seen = new Set(moments.map(m => m.t + m.txt));
    for(const mm of data.moments || []) if(!seen.has(mm.t + mm.txt)) moments.push(mm);
    moments.sort((a,b) => a.t - b.t); saveMoments();
    for(const cw of data.custom || []) if(!OURS.words.find(x => x.id === cw.id)) OURS.words.push(cw);
    saveCustom();
    const att = LS.get("attempts", {}); for(const [k,v] of Object.entries(data.attempts||{})) att[k] = Math.max(att[k]||0, v); LS.set("attempts", att);
    if(!settings.name && data.settings && data.settings.name){ settings.name = data.settings.name; saveSettings(); }
    let n = 0;
    for(const [k, v] of Object.entries(data.media || {})){
      const [id, kind] = k.split("|");
      if(kind === "audio"){ const b = await dataURLToBlob(v); await DB.set(k, b); media.audio.set(id, URL.createObjectURL(b)); n++; }
      if(kind === "photo"){ await DB.set(k, v); media.photo.set(id, v); n++; }
    }
    sfx.chime(); FX.burst(["💞","💛","⭐"]); toast(`יובא! ${n} הקלטות ותמונות 💞`, 3000); renderParent();
  }catch(e){ toast("הקובץ לא נראה כמו גיבוי של פטפוט"); }
}

});
